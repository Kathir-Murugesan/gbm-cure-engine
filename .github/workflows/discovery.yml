name: GBM Autonomous Discovery Engine

on:
  schedule:
    # Runs automatically every 3 hours around the clock
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows you to trigger manual runs anytime from the Actions tab

jobs:
  run-discovery:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install rdkit selfies xgboost scikit-learn pandas numpy requests

    - name: Run GBM Discovery Batch
      run: |
        python run_engine.py

    - name: Commit and Push Updated SQLite Database
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GBM-Discovery-Bot"
        git config --global user.email "bot@users.noreply.github.com"
        git pull origin main || true
        git add gbm_workspace/gbm_vault.sqlite gbm_workspace/adaptive_state.json || true
        git commit -m "Auto-checkpoint: Updated GBM Vault & Regression Brain [skip ci]" || true
        git push origin main || true
