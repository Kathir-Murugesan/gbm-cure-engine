name: GBM Autonomous Discovery Engine

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-discovery:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install rdkit selfies xgboost scikit-learn pandas numpy requests

    - name: Run GBM Discovery Batch
      run: |
        python run_engine.py

    - name: Commit and Push Updated SQLite Database
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GBM-Discovery-Bot"
        git config --global user.email "bot@users.noreply.github.com"
        git add gbm_workspace/gbm_vault.sqlite gbm_workspace/adaptive_state.json
        git commit -m "Auto-checkpoint: Updated GBM Vault & Regression Brain [skip ci]" || echo "No changes to commit"
        git pull origin main --rebase
        git push origin main
